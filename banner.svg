    <tspan fill="#eaf0ff">komendant</tspan> 
    <tspan fill="transparent" stroke="#4f8cff" stroke-width="2px">zero</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="50%" y="155" text-anchor="middle" dominant-baseline="middle" font-family="'Courier New', Consolas, monospace" font-size="16px" fill="#5a6a88" letter-spacing="1px">
    everything starts from zero.<tspan fill="#4f8cff" font-weight="bold">_
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
    </tspan>
  </text>

