<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Glow imitating the website -->
    <radialGradient id="glow" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#182a4d" />
      <stop offset="100%" stop-color="#06080d" />
    </radialGradient>
    
    <!-- Dot Pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2438" />
    </pattern>
  </defs>

  <!-- Background Layers -->
  <rect width="100%" height="100%" fill="#06080d" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  <rect width="100%" height="100%" fill="url(#dots)" />

  <!-- Main Title -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64px" letter-spacing="-2px">
    <tspan fill="#eaf0ff">komendant</tspan> 
    <tspan fill="transparent" stroke="#4f8cff" stroke-width="2px">zero</tspan>
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="50%" y="74%" text-anchor="middle" dominant-baseline="middle" font-family="'Courier New', Consolas, monospace" font-size="16px" fill="#5a6a88" letter-spacing="1px">
    everything starts from zero.<tspan fill="#4f8cff" font-weight="bold">_
      <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
    </tspan>
  </text>
</svg>
