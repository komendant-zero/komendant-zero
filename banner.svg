<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#142446" />
      <stop offset="100%" stop-color="#06080d" />
    </radialGradient>
    
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2438" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#06080d" />
  <rect width="100%" height="100%" fill="url(#glow)" />
  <rect width="100%" height="100%" fill="url(#dots)" />

  <!-- Scanning Line -->
  <rect x="0" y="0" width="100%" height="1" fill="#4f8cff" opacity="0.3">
